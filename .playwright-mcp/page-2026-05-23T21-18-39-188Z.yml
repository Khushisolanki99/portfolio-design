  - generic [ref=e133]:
    - generic [ref=e134]: PM / BA Thinking
    - heading "Decisions that shaped the spec." [level=2] [ref=e135]:
      - text: Decisions that
      - text: shaped the spec.
    - generic [ref=e136]:
      - generic [ref=e137]:
        - generic [ref=e138]: "01"
        - generic [ref=e139]: Precision over recall
        - generic [ref=e140]: Better to surface Nudge only when intent is high than to show it everywhere and train buyers to dismiss it. Trigger logic was the core product decision.
      - generic [ref=e141]:
        - generic [ref=e142]: "02"
        - generic [ref=e143]: Trust inside an embed
        - generic [ref=e144]: Buyers needed visible security signals and merchant branding inside the widget. An anonymous checkout panel would see zero completions.
      - generic [ref=e145]:
        - generic [ref=e146]: "03"
        - generic [ref=e147]: Platform constraints first
        - generic [ref=e148]: CSP headers, iframe sandboxing, third-party cookie deprecation — not edge cases, they were the spec. Handled before design, not as afterthoughts.
      - generic [ref=e149]:
        - generic [ref=e150]: "04"
        - generic [ref=e151]: Scope discipline
        - generic [ref=e152]: Cut loyalty hooks, wishlist sync, and social proof in week 2. That discipline saved four weeks of scope negotiation and kept the MVP shippable on time.
