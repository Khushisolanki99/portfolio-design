    - generic [ref=e64]:
      - generic [ref=e65]: 02 / The Solution
      - heading "One embed tag. Zero redirects. Intent preserved." [level=2] [ref=e66]:
        - text: One embed tag.
        - emphasis [ref=e67]: Zero redirects.
        - text: Intent preserved.
      - generic [ref=e68]:
        - generic [ref=e69]:
          - generic [ref=e70]: "01"
          - generic [ref=e71]: Zero-redirect checkout
          - generic [ref=e72]: The entire purchase flow completes inside the surface where the buyer found the product. No new tab. No lost context. No abandoned cart.
        - generic [ref=e73]:
          - generic [ref=e74]: "02"
          - generic [ref=e75]: Single embed tag
          - generic [ref=e76]: Merchants integrate via one script tag. No complex SDK, no backend dependency on the publisher side. Auth, inventory, and payment all handled by the layer.
        - generic [ref=e77]:
          - generic [ref=e78]: "03"
          - generic [ref=e79]: Real-time inventory sync
          - generic [ref=e80]: Variant state and inventory pulled live from the merchant catalog. No double-entry, no stale data, no "sorry, out of stock" after checkout attempt.
