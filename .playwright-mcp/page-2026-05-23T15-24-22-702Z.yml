        - generic [ref=e46]: 01 / The Problem
        - generic [ref=e47]: "\"70% of high-intent shoppers abandon at the redirect — the moment between 'I want this' and 'where do I buy it'.\""
        - generic [ref=e48]: 70%
        - generic [ref=e49]: of buyers who click a product link from content never complete a purchase. The redirect is the primary drop point.
      - generic [ref=e50]:
        - generic [ref=e51]:
          - generic [ref=e52]: R.01
          - generic [ref=e53]: Interviewed 14 buyers across social commerce — TikTok Shop, Instagram, creator links. Every single drop happened at the redirect.
        - generic [ref=e54]:
          - generic [ref=e55]: R.02
          - generic [ref=e56]: "Mapped 8 merchant onboarding flows. Average: 3 redirects before a buyer could complete a purchase."
        - generic [ref=e57]:
          - generic [ref=e58]: R.03
          - generic [ref=e59]: Audited 6 competitor embed SDKs. All required full-page redirect or iframe with auth handoff. Zero native embeds existed.
        - generic [ref=e60]:
          - generic [ref=e61]: R.04
          - generic [ref=e62]: "\"The moment I leave the app, the intent is gone.\" — repeated across 11 of 14 buyer interviews."
  - generic [ref=e63]:
