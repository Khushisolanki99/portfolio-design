      - generic [ref=e93]:
        - paragraph [ref=e94]: Risk-first, not status-first.
        - paragraph [ref=e95]: Most delivery dashboards answer "where is my order?" RTO Guard answers "which orders are about to fail, and what should I do about them?" That shift — from status reporting to risk prioritization — is the core product decision. Clear risk categories, order-level drilldown, and action-oriented layout are all downstream of that framing.
