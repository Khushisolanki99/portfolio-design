      - generic [ref=e72]:
        - paragraph [ref=e73]: Checkout doesn't have to wait for a redirect.
        - paragraph [ref=e74]: Nudge is a concept that embeds the buying moment into the content surface itself. When intent peaks — inside a review, a recommendation, an editorial — that's when checkout should live. Not after a handoff. Not after a tab switch. Right there.
