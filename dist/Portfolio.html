<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khushi Solanki — Portfolio 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=Special+Elite&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" crossorigin href="/assets/styles-_8Owc8BZ.css">
</head>
<body>
  <div id="root"></div>
  <div class="cursor-dot"  id="cursor-dot"  aria-hidden="true"></div>
  <div class="cursor-ring" id="cursor-ring" aria-hidden="true"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="case-studies.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="process.jsx"></script>
  <script type="text/babel" src="visual-diary.jsx"></script>
  <script type="text/babel" src="creative-direction.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script>
  (function () {
    var dot  = document.getElementById('cursor-dot');
    var ring = document.getElementById('cursor-ring');
    if (!dot || !ring || window.matchMedia('(pointer: coarse)').matches) return;

    var x = 0, y = 0, raf = 0;

    document.addEventListener('mousemove', function (e) {
      x = e.clientX; y = e.clientY;
      dot.style.opacity  = '1';
      ring.style.opacity = '1';
      if (!raf) raf = requestAnimationFrame(paint);
    });

    function paint() {
      raf = 0;
      dot.style.left  = x + 'px';
      dot.style.top   = y + 'px';
      ring.style.left = x + 'px';
      ring.style.top  = y + 'px';
    }

    document.addEventListener('mouseover', function (e) {
      var el = e.target && e.target.closest('a, button, [role="button"], .work-card, .art-tile, label, .skill-pill, .cs-nav-btn');
      ring.classList.toggle('hover', !!el);
    });
  })();
  </script>
</body>
</html>
