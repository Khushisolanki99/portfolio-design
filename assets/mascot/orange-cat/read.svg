<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- READING — sitting, holding book, round glasses -->
  <!-- Tail -->
  <path d="M80,104 Q104,100 106,86 Q108,70 94,66" stroke="#D96020" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M80,104 Q104,100 106,86 Q108,70 94,66" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Body -->
  <ellipse cx="58" cy="90" rx="26" ry="26" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <ellipse cx="58" cy="96" rx="14" ry="17" fill="#E89050"/>
  <!-- Body stripe -->
  <path d="M38,78 Q36,88 38,100" stroke="#A83808" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Book (held in paws) -->
  <rect x="28" y="92" width="46" height="26" rx="3" fill="#3B7A56" stroke="#1A0A00" stroke-width="2"/>
  <line x1="50" y1="92" x2="50" y2="118" stroke="#1A0A00" stroke-width="3" opacity="0.4"/>
  <line x1="52" y1="97" x2="70" y2="97" stroke="#F0E8D8" stroke-width="1.5"/>
  <line x1="52" y1="102" x2="70" y2="102" stroke="#F0E8D8" stroke-width="1.5"/>
  <line x1="52" y1="107" x2="70" y2="107" stroke="#F0E8D8" stroke-width="1.5"/>
  <line x1="30" y1="97" x2="48" y2="97" stroke="#F0E8D8" stroke-width="1.5"/>
  <line x1="30" y1="102" x2="48" y2="102" stroke="#F0E8D8" stroke-width="1.5"/>
  <line x1="30" y1="107" x2="48" y2="107" stroke="#F0E8D8" stroke-width="1.5"/>
  <!-- Paws holding book -->
  <ellipse cx="36" cy="92" rx="10" ry="6" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <ellipse cx="66" cy="92" rx="10" ry="6" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Head -->
  <circle cx="60" cy="44" r="30" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Ears -->
  <polygon points="34,26 42,8 56,28" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="38,24 43,12 54,26" fill="#C04828"/>
  <polygon points="64,28 78,8 86,26" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="66,26 77,12 82,24" fill="#C04828"/>
  <!-- Forehead stripes -->
  <path d="M50,22 Q52,28 51,34" stroke="#A83808" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M60,20 Q60,26 60,33" stroke="#A83808" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M70,22 Q68,28 69,34" stroke="#A83808" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Round glasses -->
  <circle cx="48" cy="44" r="10" fill="none" stroke="#1A0A00" stroke-width="2"/>
  <circle cx="72" cy="44" r="10" fill="none" stroke="#1A0A00" stroke-width="2"/>
  <line x1="58" y1="44" x2="62" y2="44" stroke="#1A0A00" stroke-width="2"/>
  <line x1="82" y1="42" x2="90" y2="40" stroke="#1A0A00" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="42" x2="30" y2="40" stroke="#1A0A00" stroke-width="2" stroke-linecap="round"/>
  <!-- Eyes (behind glasses, focused/squinting) -->
  <circle cx="48" cy="44" r="7" fill="#1A0A00"/>
  <circle cx="51" cy="40" r="2.5" fill="white"/>
  <circle cx="72" cy="44" r="7" fill="#1A0A00"/>
  <circle cx="75" cy="40" r="2.5" fill="white"/>
  <!-- Nose -->
  <polygon points="60,54 55,59 65,59" fill="#8A2008"/>
  <!-- Focused mouth (flat) -->
  <line x1="54" y1="61" x2="66" y2="61" stroke="#1A0A00" stroke-width="2" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="53" y1="57" x2="24" y2="52" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="53" y1="61" x2="24" y2="67" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="67" y1="57" x2="96" y2="52" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="67" y1="61" x2="96" y2="67" stroke="#1A0A00" stroke-width="1.3"/>
</svg>
