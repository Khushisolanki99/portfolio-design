<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- PLAYFUL — winking face, cheeky grin, one paw up -->
  <!-- Body -->
  <ellipse cx="58" cy="106" rx="28" ry="18" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <ellipse cx="58" cy="110" rx="16" ry="12" fill="#E89050"/>
  <!-- Paw raised -->
  <line x1="76" y1="88" x2="94" y2="68" stroke="#D96020" stroke-width="11" stroke-linecap="round"/>
  <line x1="76" y1="88" x2="94" y2="68" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="96" cy="65" rx="10" ry="8" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Neck -->
  <ellipse cx="58" cy="84" rx="18" ry="10" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Head -->
  <circle cx="58" cy="50" r="36" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Left ear -->
  <polygon points="26,28 34,8 50,30" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="31,26 35,14 48,28" fill="#C04828"/>
  <!-- Right ear -->
  <polygon points="66,30 82,10 90,28" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="68,28 81,14 85,26" fill="#C04828"/>
  <!-- Forehead stripes -->
  <path d="M48,20 Q50,28 49,36" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M58,18 Q58,26 58,34" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M68,20 Q66,28 67,36" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Left eye (wide open) -->
  <circle cx="44" cy="48" r="12" fill="#1A0A00"/>
  <circle cx="48" cy="43" r="4.5" fill="white"/>
  <!-- Right eye (winking — curved line) -->
  <path d="M63,48 Q72,40 81,48" fill="none" stroke="#1A0A00" stroke-width="3" stroke-linecap="round"/>
  <!-- Nose -->
  <polygon points="58,60 53,66 63,66" fill="#8A2008"/>
  <!-- Cheeky grin (asymmetric) -->
  <path d="M46,66 Q58,76 72,62" fill="none" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="51" y1="63" x2="20" y2="57" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="51" y1="67" x2="20" y2="73" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="65" y1="63" x2="96" y2="57" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="65" y1="67" x2="96" y2="73" stroke="#1A0A00" stroke-width="1.3"/>
</svg>
