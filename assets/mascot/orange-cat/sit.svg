<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- FULL FRONT sitting — perfectly symmetric -->
  <!-- Tail (wraps right, tip visible at left bottom) -->
  <path d="M82,104 Q106,100 108,86 Q110,70 96,66" stroke="#D96020" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M82,104 Q106,100 108,86 Q110,70 96,66" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Body -->
  <ellipse cx="60" cy="88" rx="26" ry="28" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Belly -->
  <ellipse cx="60" cy="94" rx="14" ry="19" fill="#E89050"/>
  <!-- Body stripes L -->
  <path d="M36,72 Q32,82 34,94" stroke="#A83808" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M30,78 Q26,87 28,98" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Paws -->
  <ellipse cx="44" cy="112" rx="13" ry="7" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <ellipse cx="76" cy="112" rx="13" ry="7" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Neck -->
  <ellipse cx="60" cy="64" rx="16" ry="10" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Head -->
  <circle cx="60" cy="40" r="29" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Left ear -->
  <polygon points="32,26 40,7 54,27" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="36,24 41,12 52,25" fill="#C04828"/>
  <!-- Right ear -->
  <polygon points="66,27 80,8 88,26" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="68,25 79,12 84,24" fill="#C04828"/>
  <!-- Forehead stripes -->
  <path d="M52,18 Q54,24 53,30" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M60,16 Q60,22 60,29" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M68,18 Q66,24 67,30" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Eyes -->
  <circle cx="48" cy="40" r="10" fill="#1A0A00"/>
  <circle cx="52" cy="36" r="3.5" fill="white"/>
  <circle cx="72" cy="40" r="10" fill="#1A0A00"/>
  <circle cx="76" cy="36" r="3.5" fill="white"/>
  <!-- Nose -->
  <polygon points="60,50 55,56 65,56" fill="#8A2008"/>
  <!-- Mouth -->
  <path d="M55,56 Q60,62 65,56" fill="none" stroke="#1A0A00" stroke-width="2" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="53" y1="53" x2="24" y2="49" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="53" y1="57" x2="24" y2="61" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="67" y1="53" x2="96" y2="49" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="67" y1="57" x2="96" y2="61" stroke="#1A0A00" stroke-width="1.3"/>
</svg>
