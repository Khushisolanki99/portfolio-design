<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- POUNCING — low crouch with fish toy, reference style -->
  <!-- Tail (up, alert) -->
  <path d="M22,86 Q14,70 18,54 Q22,38 16,24" stroke="#D96020" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M22,86 Q14,70 18,54 Q22,38 16,24" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Body (low, crouching, angled downward front) -->
  <ellipse cx="52" cy="80" rx="34" ry="18" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <ellipse cx="52" cy="86" rx="20" ry="10" fill="#E89050"/>
  <!-- Body stripes -->
  <path d="M34,66 Q32,76 34,88" stroke="#A83808" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M44,62 Q42,74 44,88" stroke="#A83808" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Back legs (haunches up) -->
  <line x1="26" y1="90" x2="20" y2="112" stroke="#D96020" stroke-width="11" stroke-linecap="round"/>
  <line x1="26" y1="90" x2="20" y2="112" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="18" cy="113" rx="9" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <line x1="34" y1="92" x2="28" y2="114" stroke="#D96020" stroke-width="10" stroke-linecap="round"/>
  <line x1="34" y1="92" x2="28" y2="114" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="26" cy="115" rx="9" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Front leg reaching toward fish -->
  <line x1="78" y1="84" x2="100" y2="100" stroke="#D96020" stroke-width="11" stroke-linecap="round"/>
  <line x1="78" y1="84" x2="100" y2="100" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="101" cy="101" rx="9" ry="6" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Front leg on ground -->
  <line x1="68" y1="88" x2="72" y2="108" stroke="#D96020" stroke-width="11" stroke-linecap="round"/>
  <line x1="68" y1="88" x2="72" y2="108" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="72" cy="109" rx="9" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Fish toy -->
  <ellipse cx="112" cy="106" rx="10" ry="7" fill="#6AADCC" stroke="#1A0A00" stroke-width="2"/>
  <polygon points="120,100 120,112 114,106" fill="#4A8DAC" stroke="#1A0A00" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="108" cy="104" r="2" fill="#1A0A00"/>
  <!-- Head (side, low, intense look) -->
  <circle cx="88" cy="56" r="24" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <polygon points="76,38 84,22 96,40" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="80,36 84,26 94,38" fill="#C04828"/>
  <path d="M78,36 Q80,42 79,48" stroke="#A83808" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Intense eye (slit pupil for focus) -->
  <circle cx="98" cy="54" r="9" fill="#1A0A00"/>
  <circle cx="102" cy="50" r="2.5" fill="white"/>
  <!-- Nose -->
  <polygon points="108,60 105,65 113,65" fill="#8A2008"/>
  <path d="M105,65 Q108,69 113,65" fill="none" stroke="#1A0A00" stroke-width="2" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="105" y1="62" x2="120" y2="57" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="105" y1="66" x2="120" y2="70" stroke="#1A0A00" stroke-width="1.3"/>
</svg>
