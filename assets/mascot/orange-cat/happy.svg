<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- HAPPY — excited face, large eyes, big smile, sparkles -->
  <!-- Body (bottom) -->
  <ellipse cx="60" cy="106" rx="28" ry="18" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <ellipse cx="60" cy="110" rx="16" ry="12" fill="#E89050"/>
  <!-- Neck -->
  <ellipse cx="60" cy="82" rx="18" ry="10" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Head -->
  <circle cx="60" cy="50" r="36" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Left ear -->
  <polygon points="28,28 36,8 52,30" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="33,26 37,14 50,28" fill="#C04828"/>
  <!-- Right ear -->
  <polygon points="68,30 84,10 92,28" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="70,28 83,14 87,26" fill="#C04828"/>
  <!-- Forehead stripes -->
  <path d="M50,20 Q52,28 51,36" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M60,18 Q60,26 60,34" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M70,20 Q68,28 69,36" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Eyes (large, excited) -->
  <circle cx="46" cy="48" r="12" fill="#1A0A00"/>
  <circle cx="51" cy="43" r="4.5" fill="white"/>
  <circle cx="74" cy="48" r="12" fill="#1A0A00"/>
  <circle cx="79" cy="43" r="4.5" fill="white"/>
  <!-- Star sparkles near eyes -->
  <text x="26" y="36" font-size="12" fill="#1A0A00" font-family="serif">✦</text>
  <text x="88" y="34" font-size="12" fill="#1A0A00" font-family="serif">✦</text>
  <text x="100" y="48" font-size="9" fill="#1A0A00" font-family="serif">✦</text>
  <!-- Nose -->
  <polygon points="60,60 55,66 65,66" fill="#8A2008"/>
  <!-- Very big smile (open) -->
  <path d="M44,66 Q60,82 76,66" fill="none" stroke="#1A0A00" stroke-width="3" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="53" y1="63" x2="22" y2="57" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="53" y1="67" x2="22" y2="73" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="67" y1="63" x2="98" y2="57" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="67" y1="67" x2="98" y2="73" stroke="#1A0A00" stroke-width="1.3"/>
</svg>
