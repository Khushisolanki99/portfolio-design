<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- FAST ASLEEP — tight curled ball -->
  <!-- Outer body curl -->
  <ellipse cx="60" cy="82" rx="46" ry="28" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Tail wrapping around (on top) -->
  <path d="M100,68 Q112,78 106,90 Q100,102 86,100 Q70,98 62,100" stroke="#D96020" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M100,68 Q112,78 106,90 Q100,102 86,100 Q70,98 62,100" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Tail tip -->
  <ellipse cx="62" cy="100" rx="7" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Body stripes -->
  <path d="M22,74 Q20,84 22,94" stroke="#A83808" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M32,70 Q30,82 32,96" stroke="#A83808" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Face (tucked, small) -->
  <circle cx="38" cy="74" r="20" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Ear -->
  <polygon points="24,60 30,44 42,62" fill="#D96020" stroke="#1A0A00" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="28,58 31,48 40,60" fill="#C04828"/>
  <!-- Eyes closed (curved lines) -->
  <path d="M30,73 Q34,68 38,73" fill="none" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M38,73 Q42,68 46,73" fill="none" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tiny nose -->
  <circle cx="38" cy="79" r="3" fill="#8A2008"/>
  <!-- ZZZ text -->
  <text x="72" y="44" font-size="18" font-weight="bold" fill="#1A0A00" font-family="serif" opacity="0.85">z</text>
  <text x="82" y="32" font-size="22" font-weight="bold" fill="#1A0A00" font-family="serif" opacity="0.85">z</text>
  <text x="94" y="18" font-size="26" font-weight="bold" fill="#1A0A00" font-family="serif" opacity="0.85">z</text>
</svg>
