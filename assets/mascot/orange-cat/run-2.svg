<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- RUNNING — bunched/gathered, facing right -->
  <!-- Tail -->
  <path d="M14,60 Q8,50 12,40 Q16,30 10,20" stroke="#D96020" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M14,60 Q8,50 12,40 Q16,30 10,20" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Body (bunched, slightly arched) -->
  <ellipse cx="54" cy="58" rx="38" ry="22" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <ellipse cx="54" cy="66" rx="24" ry="12" fill="#E89050"/>
  <!-- Body stripes -->
  <path d="M28,44 Q26,56 28,70" stroke="#A83808" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M40,40 Q38,54 40,70" stroke="#A83808" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M52,40 Q50,54 52,70" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Back legs gathered under body -->
  <line x1="24" y1="72" x2="16" y2="100" stroke="#D96020" stroke-width="11" stroke-linecap="round"/>
  <line x1="24" y1="72" x2="16" y2="100" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="15" cy="101" rx="9" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <line x1="34" y1="76" x2="28" y2="104" stroke="#D96020" stroke-width="10" stroke-linecap="round"/>
  <line x1="34" y1="76" x2="28" y2="104" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="27" cy="105" rx="9" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Front legs gathered -->
  <line x1="80" y1="72" x2="88" y2="100" stroke="#D96020" stroke-width="11" stroke-linecap="round"/>
  <line x1="80" y1="72" x2="88" y2="100" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="88" cy="101" rx="9" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <line x1="88" y1="70" x2="98" y2="96" stroke="#D96020" stroke-width="10" stroke-linecap="round"/>
  <line x1="88" y1="70" x2="98" y2="96" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="98" cy="97" rx="9" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Head -->
  <circle cx="94" cy="38" r="22" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <polygon points="82,22 90,6 102,24" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="86,20 90,10 100,22" fill="#C04828"/>
  <path d="M84,22 Q86,28 85,34" stroke="#A83808" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="102" cy="36" r="8" fill="#1A0A00"/>
  <circle cx="105" cy="32" r="2.5" fill="white"/>
  <polygon points="111,42 108,47 116,47" fill="#8A2008"/>
  <path d="M108,47 Q111,51 116,47" fill="none" stroke="#1A0A00" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="44" x2="120" y2="40" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="108" y1="48" x2="120" y2="52" stroke="#1A0A00" stroke-width="1.3"/>
</svg>
