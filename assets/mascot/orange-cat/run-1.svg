<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- RUNNING — full stretch, body horizontal, facing right -->
  <!-- Tail (streaming straight back) -->
  <path d="M14,58 Q8,52 10,44 Q12,36 8,28" stroke="#D96020" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M14,58 Q8,52 10,44 Q12,36 8,28" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Body (very horizontal, stretched) -->
  <ellipse cx="56" cy="62" rx="44" ry="18" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <ellipse cx="56" cy="68" rx="30" ry="10" fill="#E89050"/>
  <!-- Body stripes -->
  <path d="M30,48 Q28,58 30,72" stroke="#A83808" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M42,44 Q40,56 42,72" stroke="#A83808" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M54,44 Q52,56 54,72" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Back legs fully extended back -->
  <line x1="22" y1="72" x2="8" y2="98" stroke="#D96020" stroke-width="11" stroke-linecap="round"/>
  <line x1="22" y1="72" x2="8" y2="98" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="7" cy="99" rx="9" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <line x1="30" y1="74" x2="18" y2="102" stroke="#D96020" stroke-width="10" stroke-linecap="round"/>
  <line x1="30" y1="74" x2="18" y2="102" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="17" cy="103" rx="9" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Front legs fully extended forward -->
  <line x1="84" y1="68" x2="100" y2="94" stroke="#D96020" stroke-width="11" stroke-linecap="round"/>
  <line x1="84" y1="68" x2="100" y2="94" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="101" cy="95" rx="9" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <line x1="92" y1="66" x2="110" y2="90" stroke="#D96020" stroke-width="10" stroke-linecap="round"/>
  <line x1="92" y1="66" x2="110" y2="90" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="111" cy="91" rx="9" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Head (side, low) -->
  <circle cx="96" cy="40" r="22" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <polygon points="84,24 92,8 104,26" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="88,22 92,12 102,24" fill="#C04828"/>
  <path d="M86,24 Q88,30 87,36" stroke="#A83808" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="104" cy="38" r="8" fill="#1A0A00"/>
  <circle cx="107" cy="34" r="2.5" fill="white"/>
  <polygon points="113,44 110,49 118,49" fill="#8A2008"/>
  <path d="M110,49 Q113,53 118,49" fill="none" stroke="#1A0A00" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="46" x2="120" y2="42" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="110" y1="50" x2="120" y2="54" stroke="#1A0A00" stroke-width="1.3"/>
</svg>
