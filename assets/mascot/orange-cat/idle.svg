<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- 3/4 FRONT sitting — reference style -->
  <!-- Tail curling left -->
  <path d="M44,100 Q18,96 16,80 Q14,64 26,62" stroke="#D96020" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M44,100 Q18,96 16,80 Q14,64 26,62" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Body -->
  <ellipse cx="62" cy="88" rx="26" ry="28" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Belly -->
  <ellipse cx="62" cy="94" rx="14" ry="19" fill="#E89050"/>
  <!-- Body stripes (right side, 3/4 view) -->
  <path d="M80,72 Q84,82 82,94" stroke="#A83808" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M86,78 Q90,87 88,98" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Paws -->
  <ellipse cx="78" cy="112" rx="13" ry="7" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <ellipse cx="48" cy="112" rx="13" ry="7" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Neck -->
  <ellipse cx="62" cy="64" rx="16" ry="10" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Head (big, round) -->
  <circle cx="62" cy="40" r="29" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Left ear -->
  <polygon points="34,26 41,7 56,27" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="38,24 42,12 54,25" fill="#C04828"/>
  <!-- Right ear -->
  <polygon points="70,27 78,8 88,26" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="72,25 79,12 86,24" fill="#C04828"/>
  <!-- Forehead stripes -->
  <path d="M54,18 Q56,24 55,30" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M62,16 Q62,22 62,29" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M70,18 Q68,24 69,30" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Eyes (large round black dots) -->
  <circle cx="50" cy="40" r="10" fill="#1A0A00"/>
  <circle cx="54" cy="36" r="3.5" fill="white"/>
  <circle cx="74" cy="40" r="10" fill="#1A0A00"/>
  <circle cx="78" cy="36" r="3.5" fill="white"/>
  <!-- Nose -->
  <polygon points="62,50 57,56 67,56" fill="#8A2008"/>
  <!-- Mouth -->
  <path d="M57,56 Q62,62 67,56" fill="none" stroke="#1A0A00" stroke-width="2" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="55" y1="53" x2="26" y2="49" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="55" y1="57" x2="26" y2="61" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="69" y1="53" x2="98" y2="49" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="69" y1="57" x2="98" y2="61" stroke="#1A0A00" stroke-width="1.3"/>
</svg>
