<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- ASKING FOR FOOD — full body, both paws raised, speech bubble -->
  <!-- Tail (wraps around) -->
  <path d="M76,104 Q98,100 100,86 Q102,70 88,66" stroke="#D96020" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M76,104 Q98,100 100,86 Q102,70 88,66" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Body -->
  <ellipse cx="56" cy="90" rx="26" ry="26" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <ellipse cx="56" cy="96" rx="14" ry="17" fill="#E89050"/>
  <!-- Body stripes -->
  <path d="M36,78 Q34,88 36,100" stroke="#A83808" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Both paws raised up (begging) -->
  <line x1="42" y1="80" x2="26" y2="58" stroke="#D96020" stroke-width="11" stroke-linecap="round"/>
  <line x1="42" y1="80" x2="26" y2="58" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="24" cy="55" rx="10" ry="8" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <line x1="70" y1="80" x2="86" y2="58" stroke="#D96020" stroke-width="11" stroke-linecap="round"/>
  <line x1="70" y1="80" x2="86" y2="58" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="88" cy="55" rx="10" ry="8" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Speech bubble "MEOW-PLEASE?" -->
  <rect x="64" y="2" width="52" height="22" rx="6" fill="white" stroke="#1A0A00" stroke-width="2"/>
  <polygon points="72,24 68,34 78,24" fill="white" stroke="#1A0A00" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="72,24 68,34 78,24" fill="white"/>
  <text x="68" y="18" font-size="8" font-weight="bold" fill="#1A0A00" font-family="sans-serif">MEOW!</text>
  <!-- Head (big wide eyes) -->
  <circle cx="56" cy="42" r="28" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Ears -->
  <polygon points="30,26 38,8 52,28" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="34,24 39,12 50,26" fill="#C04828"/>
  <polygon points="62,28 72,8 82,26" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="64,26 71,12 78,24" fill="#C04828"/>
  <!-- Forehead stripes -->
  <path d="M46,20 Q48,26 47,32" stroke="#A83808" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M56,18 Q56,24 56,31" stroke="#A83808" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M66,20 Q64,26 65,32" stroke="#A83808" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Eyes (HUGE, begging) -->
  <circle cx="44" cy="42" r="13" fill="#1A0A00"/>
  <circle cx="49" cy="37" r="5" fill="white"/>
  <circle cx="68" cy="42" r="13" fill="#1A0A00"/>
  <circle cx="73" cy="37" r="5" fill="white"/>
  <!-- Nose -->
  <polygon points="56,52 51,57 61,57" fill="#8A2008"/>
  <!-- Pleading open mouth -->
  <path d="M50,57 Q56,66 62,57" fill="#8A2008" stroke="#1A0A00" stroke-width="1.5"/>
  <!-- Whiskers -->
  <line x1="49" y1="54" x2="22" y2="50" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="49" y1="58" x2="22" y2="64" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="63" y1="54" x2="90" y2="50" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="63" y1="58" x2="90" y2="64" stroke="#1A0A00" stroke-width="1.3"/>
</svg>
