<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- SIDE PROFILE walking right — stride A -->
  <!-- Tail (up and back) -->
  <path d="M22,78 Q14,58 20,40 Q24,26 18,14" stroke="#D96020" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M22,78 Q14,58 20,40 Q24,26 18,14" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Body -->
  <ellipse cx="56" cy="74" rx="36" ry="24" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <ellipse cx="58" cy="82" rx="22" ry="12" fill="#E89050"/>
  <!-- Body stripes -->
  <path d="M42,56 Q40,66 42,78" stroke="#A83808" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M52,52 Q50,64 52,78" stroke="#A83808" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M62,52 Q60,64 62,78" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Hind legs (left back, right forward) -->
  <line x1="28" y1="90" x2="20" y2="114" stroke="#D96020" stroke-width="11" stroke-linecap="round"/>
  <line x1="28" y1="90" x2="20" y2="114" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="18" cy="115" rx="9" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <line x1="36" y1="92" x2="44" y2="114" stroke="#D96020" stroke-width="11" stroke-linecap="round"/>
  <line x1="36" y1="92" x2="44" y2="114" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="44" cy="115" rx="9" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Front legs -->
  <line x1="78" y1="88" x2="70" y2="112" stroke="#D96020" stroke-width="11" stroke-linecap="round"/>
  <line x1="78" y1="88" x2="70" y2="112" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="70" cy="113" rx="9" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <line x1="86" y1="88" x2="96" y2="110" stroke="#D96020" stroke-width="11" stroke-linecap="round"/>
  <line x1="86" y1="88" x2="96" y2="110" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="96" cy="111" rx="9" ry="5" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Head (side view, facing right) -->
  <circle cx="88" cy="46" r="25" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Ear -->
  <polygon points="76,28 84,12 96,30" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="80,26 84,16 94,28" fill="#C04828"/>
  <!-- Head stripe -->
  <path d="M80,28 Q82,34 81,40" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Eye -->
  <circle cx="96" cy="44" r="9" fill="#1A0A00"/>
  <circle cx="100" cy="40" r="3" fill="white"/>
  <!-- Nose -->
  <polygon points="108,50 104,55 112,55" fill="#8A2008"/>
  <!-- Mouth -->
  <path d="M104,55 Q108,60 112,55" fill="none" stroke="#1A0A00" stroke-width="2" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="104" y1="52" x2="120" y2="48" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="104" y1="56" x2="120" y2="60" stroke="#1A0A00" stroke-width="1.3"/>
</svg>
