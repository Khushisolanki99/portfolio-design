<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- SAD — droopy eyes, frown, tear -->
  <!-- Body (hunched) -->
  <ellipse cx="60" cy="106" rx="26" ry="16" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <ellipse cx="60" cy="110" rx="14" ry="10" fill="#E89050"/>
  <!-- Neck -->
  <ellipse cx="60" cy="84" rx="16" ry="9" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Head (slightly smaller, drooped) -->
  <circle cx="60" cy="52" r="34" fill="#D96020" stroke="#1A0A00" stroke-width="2.5"/>
  <!-- Ears (drooped slightly) -->
  <polygon points="28,32 34,14 50,34" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="33,30 36,18 48,32" fill="#C04828"/>
  <polygon points="70,34 86,14 92,32" fill="#D96020" stroke="#1A0A00" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="72,32 85,18 87,30" fill="#C04828"/>
  <!-- Forehead stripes -->
  <path d="M50,22 Q52,30 51,38" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M60,20 Q60,28 60,36" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M70,22 Q68,30 69,38" stroke="#A83808" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Eyes (droopy, half-closed) -->
  <circle cx="46" cy="50" r="11" fill="#1A0A00"/>
  <circle cx="50" cy="46" r="3.5" fill="white"/>
  <!-- Droopy eyelids (sad) -->
  <path d="M36,46 Q46,42 56,46" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <circle cx="74" cy="50" r="11" fill="#1A0A00"/>
  <circle cx="78" cy="46" r="3.5" fill="white"/>
  <path d="M64,46 Q74,42 84,46" fill="#D96020" stroke="#1A0A00" stroke-width="2"/>
  <!-- Nose -->
  <polygon points="60,60 55,66 65,66" fill="#8A2008"/>
  <!-- Frown -->
  <path d="M47,72 Q60,64 73,72" fill="none" stroke="#1A0A00" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tear drop -->
  <ellipse cx="44" cy="60" rx="3" ry="5" fill="#6AADCC" opacity="0.9"/>
  <path d="M44,65 Q42,69 44,70 Q46,69 44,65" fill="#6AADCC"/>
  <!-- Whiskers -->
  <line x1="53" y1="63" x2="22" y2="57" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="53" y1="67" x2="22" y2="73" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="67" y1="63" x2="98" y2="57" stroke="#1A0A00" stroke-width="1.3"/>
  <line x1="67" y1="67" x2="98" y2="73" stroke="#1A0A00" stroke-width="1.3"/>
</svg>
